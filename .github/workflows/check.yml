name: Check for new recaps

on:
  schedule:
    # Once a day; the morning notification goes out with this run. Cron is in UTC:
    # 05:37 UTC is 06:37 in Berlin in winter and 07:37 in summer. Off the full hour, when GitHub is busiest.
    - cron: "37 5 * * *"
  # Pushes only deploy the app; the watcher runs on the schedule and on demand.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "check: look for recaps and notify · quiet: look without notifying (the app uses this) · test-notification: send a test"
        type: choice
        options: [check, quiet, test-notification]
        default: check

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    env:
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
      APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Unit tests
        run: npm test

      - name: Check DAZN Fußball for new Barça recaps
        if: inputs.mode != 'test-notification'
        id: check
        run: node scripts/check.mjs ${{ inputs.mode == 'quiet' && '--quiet' || '' }}

      - name: Commit updated data
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          git commit -m "data: new recaps"
          git pull --rebase
          git push

      # GitHub disables scheduled workflows after 60 days without repository activity
      # (e.g. during the summer break), so keep the repo alive with a monthly heartbeat.
      - name: Keepalive heartbeat
        if: github.event_name == 'schedule' && steps.check.outputs.changed != 'true'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 30 * 24 * 3600 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u +%FT%TZ > data/heartbeat.txt
            git add data/heartbeat.txt
            git commit -m "chore: keepalive"
            git pull --rebase
            git push
          fi

      - name: Test notification
        if: inputs.mode == 'test-notification'
        run: node scripts/check.mjs --test-notify

  deploy:
    needs: check
    # After a push (the check job is skipped then) or when the watcher found something.
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || needs.check.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
